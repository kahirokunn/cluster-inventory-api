{{- $method := .Values.tls.method -}}
{{- if not (has $method (list "helm" "cronJob" "certmanager")) -}}
  {{- fail "tls.method must be helm, cronJob, or certmanager" -}}
{{- end -}}
{{- if and (ne $method "certmanager") (or (le (int .Values.tls.certValidityDays) 0) (le (int .Values.tls.caValidityDays) (int .Values.tls.certValidityDays))) -}}
  {{- fail "tls.caValidityDays must exceed positive tls.certValidityDays" -}}
{{- end -}}
{{- if and (eq $method "cronJob") (or (le (int .Values.tls.cronJob.renewBeforeDays) 0) (ge (int .Values.tls.cronJob.renewBeforeDays) (int .Values.tls.certValidityDays))) -}}
  {{- fail "tls.cronJob.renewBeforeDays must be positive and below tls.certValidityDays" -}}
{{- end -}}
{{- $name := include "addon-webhook.fullname" . -}}
{{- $bundle := "" -}}
{{- if ne $method "certmanager" -}}
  {{- $_ := include "addon-webhook.tls.setup" . -}}
  {{- $bundle = .addonCA.Cert | b64enc -}}
  {{- if eq $method "cronJob" -}}
    {{- with lookup "admissionregistration.k8s.io/v1" "ValidatingWebhookConfiguration" "" $name -}}
      {{- if .webhooks -}}
        {{- $bundle = (index .webhooks 0).clientConfig.caBundle -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $name }}
  labels:
    {{- include "addon-webhook.labels" . | nindent 4 }}
  {{- if eq $method "certmanager" }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" .Release.Namespace $name | quote }}
  {{- end }}
webhooks:
  - name: addon-update.multicluster.x-k8s.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    clientConfig:
      service:
        name: {{ $name }}
        namespace: {{ .Release.Namespace }}
        path: /validate-addon-update
        port: 443
      {{- if ne $method "certmanager" }}
      caBundle: {{ $bundle }}
      {{- end }}
    rules:
      - apiGroups: [multicluster.x-k8s.io]
        apiVersions: [v1alpha1]
        operations: [UPDATE]
        resources: [addons]
        scope: Namespaced
  - name: addonclass-delete.multicluster.x-k8s.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    clientConfig:
      service:
        name: {{ $name }}
        namespace: {{ .Release.Namespace }}
        path: /validate-addonclass-delete
        port: 443
      {{- if ne $method "certmanager" }}
      caBundle: {{ $bundle }}
      {{- end }}
    rules:
      - apiGroups: [multicluster.x-k8s.io]
        apiVersions: [v1alpha1]
        operations: [DELETE]
        resources: [addonclasses]
        scope: Namespaced
