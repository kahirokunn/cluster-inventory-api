apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "addon-webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "addon-webhook.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "addon-webhook.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "addon-webhook.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: webhook
              containerPort: 9443
            - name: probes
              containerPort: 8081
          args: ["--cert-dir=/tls"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "addon-webhook.fullname" . }}-tls
