{{- if .Values.webhooks.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "capi-controller.fullname" . }}-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capi-controller.labels" . | nindent 4 }}
spec:
  secretName: {{ include "capi-controller.fullname" . }}-webhook-cert
  dnsNames:
    - {{ include "capi-controller.fullname" . }}-webhook.{{ .Release.Namespace }}.svc
    - {{ include "capi-controller.fullname" . }}-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ .Values.webhooks.certIssuer.name | default "capi-controller-selfsigned" }}
    kind: {{ .Values.webhooks.certIssuer.kind | default "ClusterIssuer" }}
    group: {{ .Values.webhooks.certIssuer.group | default "cert-manager.io" }}
{{- end }}
